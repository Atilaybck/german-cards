<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Almanca Kelime Kartları</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="landing.css" />
  <link rel="stylesheet" href="random.css" />
  <link rel="stylesheet" href="sentences.css" />

  <script src="landing.js" defer></script>
  <script src="random.js" defer></script>
  <script src="sentences.js" defer></script>
</head>

<body>
  <div class="app-container">
    <header>
      <h1>🇩🇪</h1>

      <div class="controls">
        <button id="reset" class="action-btn danger">Sıfırla</button>
        <button id="unlearnedBtn" class="action-btn warning">
          Ezberlenmemiş
        </button>
        <button id="randomBtn" class="action-btn success">Rastgele</button>
        <button id="sentencesBtn" class="action-btn success">Cümleler</button>
      </div>
    </header>

    <main>
      <!-- Sayfa düğmeleri -->
      <section id="paginationSection" class="pagination-section">
        <div id="pageButtons" class="pagination-grid"></div>
      </section>

      <!-- Kart alanı -->
      <section class="cards-section">
        <!-- Random mod -->
        <div id="randomControls" class="random-controls" hidden>
          <button id="randomPagesBtn" class="action-btn">Dosyalar</button>

          <div id="randomPagesPopover" class="pages-popover" hidden>
            <div id="randomPagesList" class="pages-list"></div>
            <button id="applyRandomPages" class="pages-apply">
              Seçimleri Yükle
            </button>
          </div>
        </div>

        <!-- Sentences mod -->
        <div id="sentencesControls" class="random-controls" hidden>
          <button id="sentencesPagesBtn" class="action-btn">Dosyalar</button>

          <div id="sentencesPagesPopover" class="pages-popover" hidden>
            <div id="sentencesPagesList" class="pages-list"></div>
            <button id="applySentencesPages" class="pages-apply">
              Seçimleri Yükle
            </button>
          </div>
        </div>

        <div id="cards"></div>
      </section>
    </main>
  </div>
</body>

</html>
